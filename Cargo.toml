[package]
name = "kirialsd"
version = "0.1.0"
edition = "2024"

[dependencies]
zbus = { version = "4", features = ["blocking"] }
signal-hook = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
async-io = "2"
async-channel = "2"
futures-lite = "2"
futures-util = { version = "0.3.34", default-features = false, features = ["async-await", "async-await-macro", "std"] }
